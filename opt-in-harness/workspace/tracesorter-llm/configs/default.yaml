_base_: ../../../../configs/_base_/default.yaml

model:
  backend: agent_harness
  optimizer: harness-default
  target: harness-default
  optimizer_backend: agent_harness
  target_backend: agent_harness
  reasoning_effort: medium

train:
  num_epochs: 2
  train_size: 0
  batch_size: 8
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 1
  failure_only: false

optimizer:
  learning_rate: 3
  min_learning_rate: 1
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: soft
  sel_env_num: 24
  test_env_num: 0
  eval_test: false

env:
  name: tracesorter-llm
  workspace_root: opt-in-harness/workspace/tracesorter-llm
  adapter_module: opt-in-harness/workspace/tracesorter-llm/train/adapter.py
  adapter_class: TraceSorterLlmAdapter
  skill_init: opt-in-harness/workspace/tracesorter-llm/init-skill/initial_skill.md
  split_mode: split_dir
  split_dir: opt-in-harness/workspace/tracesorter-llm/data/default_split
  data_path: ""
  split_output_dir: ""
  out_root: ""
  agent_backend: nga
  stream_subprocess_output: true
  workers: 1
  llm_timeout: 300
  max_trace_chars: 24000
  target_model: harness-default
  fbeta_beta: 0.5
  balanced_train_batches: true
  balance_labels: goodcase,badcase
