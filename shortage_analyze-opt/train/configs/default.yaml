_base_: ../../../configs/_base_/default.yaml

model:
  backend: agent_harness
  optimizer: harness-default
  target: harness-default
  optimizer_backend: agent_harness
  target_backend: agent_harness
  reasoning_effort: medium

train:
  num_epochs: 2
  train_size: 0
  batch_size: 8
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 1
  failure_only: false

optimizer:
  learning_rate: 3
  min_learning_rate: 1
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 24
  test_env_num: 0
  eval_test: false

env:
  name: shortage_analyze
  skill_init: shortage_analyze-opt/shortage_analyze-init/initial_skill.md
  split_mode: split_dir
  split_dir: shortage_analyze-opt/processed/shortage_analyze_split
  data_path: ""
  split_output_dir: ""
  out_root: shortage_analyze-opt/train/outputs/shortage_analyze
  workers: 1
  exec_timeout: 300
  max_completion_tokens: 4096
  allow_test_labels: false
  initial_skill_path: shortage_analyze-opt/shortage_analyze-init/initial_skill.md
  initial_script_path: shortage_analyze-opt/shortage_analyze-init/analyze_shortage.py
  script_cache_dir: ""
  script_codegen_timeout: 900
  script_codegen_model: harness-default
